[project]
name = "studyqa"
version = "0.1.0"
description = "p2: structured revision questions from local notes, benchmarked across small local models."
requires-python = ">=3.11"
dependencies = ["evalkit", "pydantic>=2.7", "psutil>=5.9"]

[tool.uv.sources]
evalkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studyqa"]
