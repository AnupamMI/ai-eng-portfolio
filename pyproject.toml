[project]
name = "ai-eng-portfolio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["evalkit", "studyqa"]

[tool.uv]
package = false

[tool.uv.sources]
evalkit = { workspace = true }
studyqa = { workspace = true }

[tool.uv.workspace]
members = ["shared/evalkit", "p2-offline-assistant"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["shared/evalkit/tests", "p2-offline-assistant/tests"]
# Live tests call the local Ollama server. They are deselected by default so they
# can never run during a benchmark and load a second model (run: pytest -m live).
addopts = "--import-mode=importlib -m 'not live'"
markers = ["live: needs a running Ollama server; never run during a benchmark"]
