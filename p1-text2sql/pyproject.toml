[project]
name = "text2sql"
version = "0.1.0"
description = "p1: English questions to SQLite SQL, with a clarification step for ambiguous questions."
requires-python = ">=3.11"
dependencies = ["evalkit", "httpx>=0.27", "psutil>=5.9", "pydantic>=2.7"]

[tool.uv.sources]
evalkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2sql"]
